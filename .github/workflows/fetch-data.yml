name: Fetch data

on:
  schedule:
    - cron: '30 18 * * *' # 00:00 IST
    - cron: '30 6 * * *' # 12:00 IST
  workflow_dispatch:
  issues:
    types: [opened] # a "Refresh data" issue triggers a refresh

permissions:
  contents: write
  issues: write

concurrency: fetch-data

env:
  COOLDOWN_MIN: 15 # keep in sync with COOLDOWN_MS in src/App.tsx

jobs:
  fetch:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Refresh data')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check cooldown (issue-triggered runs only)
        id: gate
        if: github.event_name == 'issues'
        run: |
          node -e '
            const last = new Date(JSON.parse(require("fs").readFileSync("data/tracker.json", "utf8")).syncedAt).getTime();
            const next = last + process.env.COOLDOWN_MIN * 60000;
            if (next > Date.now()) {
              const at = new Date(next).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", timeStyle: "short" });
              console.log("skip=true\nmessage=Data was refreshed less than " + process.env.COOLDOWN_MIN + " minutes ago. Next refresh is available at " + at + " IST.");
            }
          ' >> "$GITHUB_OUTPUT"
      - name: Fetch
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/fetch-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json
          git diff --cached --quiet || git commit -m "data: refresh tracker.json"
          git push
      - name: Close the refresh issue
        if: always() && github.event_name == 'issues'
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$MESSAGE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.gate.outputs.message || (job.status == 'success' && 'Data refreshed. Reload the dashboard in about 2 minutes.' || 'Refresh failed. An instructor needs to check the Actions log.') }}
